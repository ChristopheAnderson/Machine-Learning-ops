release_metadata:
  bundle_version: "v3.2.0-sovereign"
  release_date: "2026-11-02T00:00:00Z"
  environment: "SOVEREIGN_AIRGAP_DATACENTER_COTONOU"
  compliance_standard: "Loi N° 2017-20 Code du Numérique (APDP Bénin)"
  manifest_sha256: "e9f4b2c871d03a6e4c5192f8b7d31a04958c7e6a2b1d4f80392a1c6e7b8d9f01"
  signature_scheme: "Ed25519-Offline-Root-CA"

supervised_services_startup_order:
  - order: 1
    service_id: "svc-01-embedded-db-vault"
    type: "Service de Données Embarqué (SQLCipher WAL + DuckDB)"
    port: 5439
    healthcheck_cmd: "python -m src.healthcheck --check-db-cipher --verify-audit-chain"
    startup_timeout_sec: 10
    restart_policy: "always (backoff: 2s -> 16s)"
  - order: 2
    service_id: "svc-02-model-config-registry"
    type: "Registre Hors Ligne Modèles & Configurations Versionnés"
    port: 8081
    depends_on: ["svc-01-embedded-db-vault"]
    healthcheck_cmd: "curl -fsS http://127.0.0.1:8081/healthz/lockfile"
    startup_timeout_sec: 15
    restart_policy: "always"
  - order: 3
    service_id: "svc-03-audio-ml-inference-api"
    type: "Interface de Programmation (API REST/gRPC FastAPI + CTranslate2)"
    port: 8000
    depends_on: ["svc-01-embedded-db-vault", "svc-02-model-config-registry"]
    healthcheck_cmd: "curl -fsS http://127.0.0.1:8000/api/v1/health"
    startup_timeout_sec: 35
    restart_policy: "on-failure (max_retries: 5, circuit_breaker: enabled)"
  - order: 4
    service_id: "svc-04-offline-batch-worker"
    type: "Service de Traitement par Lots (Batch Audio & ML Queue)"
    port: 8090
    depends_on: ["svc-03-audio-ml-inference-api"]
    healthcheck_cmd: "python -m src.healthcheck --check-batch-worker-heartbeat"
    startup_timeout_sec: 20
    restart_policy: "always"
  - order: 5
    service_id: "svc-05-observability-watchdog"
    type: "Supervision, Contrôles Quotidiens & Exportateur Prometheus Hors Ligne"
    port: 9090
    depends_on: ["svc-03-audio-ml-inference-api", "svc-04-offline-batch-worker"]
    healthcheck_cmd: "curl -fsS http://127.0.0.1:9090/-/healthy"
    startup_timeout_sec: 10
    restart_policy: "always"

